[package]
name = "ra-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "rust-analyzer (ra_ap_ide) wrapped for a browser web worker via wasm-bindgen"

[lib]
crate-type = ["cdylib"]

[dependencies]
ra_ap_ide = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_hir = "=0.0.358"
ra_ap_ide_completion = "=0.0.358"
ra_ap_paths = "=0.0.358"
triomphe = "0.1"
# Pinned to the wasm-bindgen CLI that wasm-pack has cached locally.
wasm-bindgen = "=0.2.108"
console_error_panic_hook = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
  "--enable-multivalue",
]
