name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates cs106b/generated/*, which the app imports.
      - run: npm run build:cs106b

      - name: Typecheck app and Worker
        run: npm run typecheck

      # Bundles worker/index.ts without uploading; fails on bad bindings or imports.
      - name: Bundle Worker
        run: mkdir -p out && npx wrangler deploy --dry-run --outdir dist-worker
